services:
  db:
    image: postgres:16-alpine
    container_name: glimmer-bistro-db
    environment:
      POSTGRES_DB: glimmer_bistro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - glimmer_bistro_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: glimmer-bistro-api
    depends_on:
      - db
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/glimmer_bistro
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change_me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      LOCAL_UPLOAD_DIR: /app/uploads
      R2_BUCKET: ${R2_BUCKET:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    ports:
      - "4000:4000"
    volumes:
      - glimmer_bistro_uploads:/app/uploads
    restart: unless-stopped

  web:
    build: .
    container_name: glimmer-bistro-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      CONTENT_API_BASE_URL: ${CONTENT_API_BASE_URL:-http://api:4000}
      NEXT_PUBLIC_CONTENT_API_BASE_URL: ${NEXT_PUBLIC_CONTENT_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped

volumes:
  glimmer_bistro_pg_data:
  glimmer_bistro_uploads:
